name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Zero-Dependency Environment
        run: |
          python --version
          python -c "import sys; print('Python executable:', sys.executable)"

      - name: Run Full Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI Benchmark Scenarios
        run: |
          python main.py hunt ghost
          python main.py hunt legit
          python main.py hunt compliance
          python main.py mesh-status
